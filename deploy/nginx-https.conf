server {
    listen 80;
    listen [::]:80;
    server_name architecture-developer-showdown.brdanpe.tech;
    return 301 https://architecture-developer-showdown.brdanpe.tech$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name architecture-developer-showdown.brdanpe.tech;

    access_log /var/log/nginx/architecture-developer-showdown.access.log combined;
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/architecture-developer-showdown.brdanpe.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/architecture-developer-showdown.brdanpe.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
